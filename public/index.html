<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Root Editor</title><link rel="icon" type="image/png" href="/img/favicon.png"><link rel="stylesheet" href="/styles.css"></head><body><div id="login" class="login"><div class="login-card"><img class="login-logo" src="/img/logo.png" alt="Root Editor"><h1>Root Editor</h1><p>Ingresá para abrir tu workspace.</p><form id="loginForm"><input id="loginUser" placeholder="Usuario" required><input id="loginPass" type="password" placeholder="Contraseña" required><button class="save">Ingresar</button><small id="loginError"></small></form></div></div><div id="app" class="app" hidden><aside class="sidebar"><div class="brand"><span class="brand-mark">⌘</span><div><strong>Root Editor</strong><small>workspace local</small></div></div><div class="root-label"><span class="dot"></span><span id="rootName">Cargando…</span></div><div class="file-actions"><button id="newFile">＋ Archivo</button><button id="newFolder">＋ Carpeta</button><label>↑ Subir<input id="upload" type="file" hidden></label></div><div id="tree" class="tree"></div><button id="logout" class="logout">Cerrar sesión</button></aside><main class="main"><header class="topbar"><button id="toggleSidebar" class="plain" title="Mostrar u ocultar árbol">☰</button><div><div id="breadcrumbs" class="breadcrumbs">Seleccioná un archivo</div><h1 id="fileTitle">Editor de archivos</h1></div><div class="actions"><span id="status" class="status"></span><button id="download" class="plain" disabled>↓ Descargar</button><button id="rename" class="plain" disabled>Renombrar</button><button id="remove" class="danger" disabled>Eliminar</button><button id="save" class="save" disabled>Guardar</button></div></header><section class="editor-wrap"><div id="empty" class="empty"><h2>Tu espacio de trabajo</h2><p>Elegí un archivo del explorador<br>para editarlo o visualizarlo.</p></div><textarea id="editor" spellcheck="false" hidden></textarea><img id="imagePreview" hidden alt="Vista previa"></section><footer><span id="meta">Listo para editar</span><span>Solo archivos dentro de la raíz</span></footer></main></div><script src="/app.js"></script></body></html>
